<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <rect width="100" height="100" fill="#000000"/>
  <!-- Wireframe spaceship icon -->
  <g stroke="#FFFFFF" stroke-width="2" fill="none">
    <!-- Nose -->
    <line x1="50" y1="10" x2="50" y2="30"/>
    <!-- Main hull -->
    <polygon points="35,30 65,30 70,60 50,70 30,60"/>
    <!-- Left wing -->
    <line x1="35" y1="40" x2="20" y2="50"/>
    <line x1="20" y1="50" x2="35" y2="55"/>
    <!-- Right wing -->
    <line x1="65" y1="40" x2="80" y2="50"/>
    <line x1="80" y1="50" x2="65" y2="55"/>
    <!-- Engines -->
    <circle cx="40" cy="65" r="3"/>
    <circle cx="60" cy="65" r="3"/>
  </g>
</svg>
